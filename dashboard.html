<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жеке кабинет — QazaqTanu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

    :root {
      --blue: #003087;
      --gold: #f5b800;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #f0f4ff, #f8f9ff);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    header {
      background: var(--blue);
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-size: 28px; font-weight: 900; color: var(--gold); }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: var(--gold);
      color: var(--blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.3rem;
    }

    .main-content {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 5%;
    }

    .welcome {
      font-size: 2.4rem;
      color: var(--blue);
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,48,135,0.12);
      margin-bottom: 30px;
    }

    .btn {
      background: var(--gold);
      color: var(--blue);
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .logout {
      background: #d32f2f;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">QazaqTanu</div>
    <div class="user-info">
      <div class="avatar" id="user-avatar">А</div>
      <div>
        <strong id="user-name">Қош келдіңіз!</strong><br>
        <small id="user-email">user@qazaqtanu.kz</small>
      </div>
    </div>
  </header>

  <div class="main-content">
    <h1 class="welcome" id="welcome-text">Қош келдіңіз, <span id="username">Айгерім</span>!</h1>
    <p style="font-size: 1.3rem; color: #555; margin-bottom: 40px;">Сіздің жеке кабинетіңіз</p>

    <div class="card">
      <h2>Прогресс</h2>
      <p><strong>Қазіргі деңгей:</strong> Орташа (B1)</p>
      <p><strong>Оқылған сөздер:</strong> 248</p>
      <p><strong>Орындалған викториналар:</strong> 12</p>
      <button class="btn" style="margin-top: 20px;">Жаттығуды жалғастыру →</button>
    </div>

    <div class="card">
      <h2>Соңғы жетістіктер</h2>
      <p>🎉 "Тарих білгірі" — 5 викторина қатарынан дұрыс өткізілді</p>
      <p>🏆 "Сөз шебері" — 100 жаңа сөз үйренді</p>
    </div>

    <button onclick="logout()" class="btn logout" style="margin-top: 20px;">Шығу</button>
  </div>

  <script>
    // Получаем данные из localStorage (если были сохранены при регистрации/входе)
    const savedName = localStorage.getItem('userName') || "Айгерім";
    document.getElementById('username').textContent = savedName;
    document.getElementById('user-name').textContent = savedName + "!";
    document.getElementById('user-avatar').textContent = savedName[0].toUpperCase();
  </script>
</body>
</html>
